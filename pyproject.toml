[project]
name = "audio-classifier"
version = "0.1.0"
description = "Identify audio files with AcoustID/MusicBrainz, rename safely, and fill MP3 ID3 tags."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Diego Suárez" }]
keywords = ["acoustid", "chromaprint", "musicbrainz", "lastfm", "id3", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["mutagen>=1.48", "python-dotenv>=1.0"]

[project.scripts]
audio-classifier = "audio_classifier.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_classifier"]
